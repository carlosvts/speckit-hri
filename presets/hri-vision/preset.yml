schema_version: "1.0"

preset:
  id: "hri-vision"
  name: "HRI Vision"
  version: "0.1.0"
  description: "Vision sensing profile for hri-core: camera privacy, fairness, capture conditions, validity of visual inference. Install with --priority 5."
  author: "carlosvts"
  repository: "https://github.com/carlosvts/speckit-hri"
  license: "Apache-2.0"

requires:
  speckit_version: ">=1.3.2"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Appends Vision Sensing requirements to the HRI section of the spec"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Appends Vision Pipeline design to the HRI Design section of the plan"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Appends mandatory vision tasks to the HRI tasks"
      strategy: "append"

tags:
  - "hri"
  - "vision"
  - "human-robot-interaction"
