schema_version: "1.0"

preset:
  id: "hri-core"
  name: "HRI Core"
  version: "0.1.0"
  description: "Base spec-driven development preset for human-robot interaction software: interaction scenarios, signal contracts, timing budgets, failure modes, privacy, evaluation."
  author: "carlosvts"
  repository: "https://github.com/carlosvts/speckit-hri"
  license: "Apache-2.0"

requires:
  speckit_version: ">=1.3.2"

provides:
  templates:
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "HRI baseline constitution with fixed principles and project slots"
      replaces: "constitution-template"
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Appends the mandatory Human-Robot Interaction section to the core spec template"
      strategy: "append"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Appends the mandatory HRI Design section to the core plan template"
      strategy: "append"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Appends mandatory HRI tasks (foundational and verification) to the core tasks template"
      strategy: "append"
    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Wraps /specify with HRI rules (mandatory HRI section, no web/mobile timing defaults)"
      strategy: "wrap"
    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Wraps /plan with HRI rules (ID traceability, explicit I–VIII check, budget consistency)"
      strategy: "wrap"
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Wraps /tasks with HRI rules (mandatory HRI tasks and their placement)"
      strategy: "wrap"

tags:
  - "hri"
  - "robotics"
  - "human-robot-interaction"
